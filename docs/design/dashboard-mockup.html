<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard — Proposed Layout Mockup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1e1e1e;
      color: #d4d4d4;
      line-height: 1.5;
      font-size: 14px;
    }

    /* ── Topbar ── */
    .topbar {
      background: #252526;
      border-bottom: 1px solid #3e3e3e;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .topbar .crumb-current { color: #d4d4d4; font-weight: 500; }
    .topbar .fy-badge {
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 3px;
      background: #4ec9b0;
      color: #1e1e1e;
      font-weight: 600;
    }
    .topbar .fy-select {
      background: #3c3c3c;
      color: #d4d4d4;
      border: 1px solid #3e3e3e;
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
    }
    .topbar .spacer { flex: 1; }
    .topbar .reorder-btn {
      background: #3c3c3c;
      color: #d4d4d4;
      border: 1px solid #3e3e3e;
      padding: 5px 12px;
      border-radius: 3px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
    }
    .topbar .reorder-btn:hover { border-color: #007acc; }

    /* ── Card Grid ── */
    .workspace { padding: 24px 20px; }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    .card {
      background: #252526;
      border: 1px solid #3e3e3e;
      border-radius: 6px;
      padding: 16px;
    }
    .card.primary { border-color: #4ec9b0; }
    .card.secondary { opacity: 0.7; }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 12px;
      font-weight: 700;
      color: #858585;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .card-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 3px;
      background: #4ec9b0;
      color: #1e1e1e;
      font-weight: 600;
    }
    .card-badge.warn { background: #cca700; }
    .card-badge.muted { background: #3c3c3c; color: #858585; }

    .card-value {
      font-family: "SF Mono", Consolas, monospace;
      font-size: 23px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .card-sub { font-size: 12px; color: #858585; margin-top: 2px; }
    .card-detail {
      font-size: 12px;
      color: #858585;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #3e3e3e;
    }

    /* ── Pay Summary merged card internals ── */
    .pay-section { margin-bottom: 12px; }
    .pay-section:last-child { margin-bottom: 0; }
    .pay-section-title {
      font-size: 11px;
      font-weight: 600;
      color: #858585;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 6px;
    }
    .pay-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      padding: 3px 0;
    }
    .pay-row .label { color: #858585; }
    .pay-row .value {
      font-family: "SF Mono", Consolas, monospace;
      color: #d4d4d4;
    }

    /* ── YTD Comparison table ── */
    .ytd-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    .ytd-table th {
      text-align: left;
      padding: 6px 8px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #858585;
      border-bottom: 1px solid #3e3e3e;
    }
    .ytd-table th.num { text-align: right; }
    .ytd-table td { padding: 6px 8px; border-bottom: 1px solid #2a2a2a; font-size: 13px; }
    .ytd-table td.num { text-align: right; }
    .ytd-table .actual { color: #4ec9b0; }
    .ytd-table .estimated { color: #cca700; }
    .ytd-table .variance-positive { color: #4ec9b0; }
    .ytd-table .variance-negative { color: #f48771; }

    /* ── Accounts summary (de-emphasized) ── */
    .accounts-mini { font-size: 12px; color: #858585; }
    .accounts-mini .count { color: #d4d4d4; font-weight: 600; }

    @media (max-width: 640px) {
      .card-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- DASHBOARD TOPBAR with Finance Year Filter                      -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <div class="topbar">
    <span class="crumb-current">Dashboard</span>
    <span class="fy-badge" id="fyLabel">FY 2025–2026</span>
    <select class="fy-select" id="fyFilter">
      <option>FY 2025–2026</option>
      <option>FY 2024–2025</option>
      <option>FY 2023–2024</option>
      <option>FY 2022–2023</option>
      <option>FY 2021–2022</option>
    </select>
    <span class="spacer"></span>
    <button class="reorder-btn">⇅ Reorder Cards</button>
  </div>

  <main class="workspace">

    <!-- ═══════════════════════════════════════════════════════════════ -->
    <!-- CARD GRID (2 cards, 2 columns)                                 -->
    <!-- ═══════════════════════════════════════════════════════════════ -->
    <div class="card-grid">

      <!-- 1. PAY SUMMARY (merged: Last Payslip + YTD Comparison, single column) -->
      <div class="card primary">
        <div class="card-header">
          <span class="card-title">Pay Summary</span>
          <span class="card-badge muted">FY 2025–2026</span>
        </div>

        <!-- Last Payslip section -->
        <div class="pay-section">
          <div class="pay-section-title">Last Payslip</div>
          <table class="ytd-table">
            <thead>
              <tr>
                <th>Date</th>
                <th class="num">Gross</th>
                <th class="num">Net</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>2026-08-27</td>
                <td class="num actual">$3,125.00</td>
                <td class="num actual">$2,019.28</td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- YTD Comparison section -->
        <div class="pay-section" style="border-top: 1px solid #3e3e3e; padding-top: 12px;">
          <div class="pay-section-title">YTD Comparison</div>
          <table class="ytd-table">
            <thead>
              <tr>
                <th></th>
                <th class="num">Actual</th>
                <th class="num">Estimated</th>
                <th class="num">Variance</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Gross</td>
                <td class="num actual">$82,419.20</td>
                <td class="num estimated">$80,000.00</td>
                <td class="num variance-positive">+$2,419.20</td>
              </tr>
              <tr>
                <td>NET</td>
                <td class="num actual">$62,150.80</td>
                <td class="num estimated">$60,000.00</td>
                <td class="num variance-positive">+$2,150.80</td>
              </tr>
              <tr>
                <td>PAYG</td>
                <td class="num actual">$19,500.00</td>
                <td class="num estimated">$20,000.00</td>
                <td class="num variance-negative">−$500.00</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 2. [reserved for future card] -->

    </div>
  </main>

</body>
</html>
